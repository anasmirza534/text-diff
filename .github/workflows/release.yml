name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - run: cp dist/index.html "text-diff-${{ github.ref_name }}.html"

      - uses: softprops/action-gh-release@v2
        with:
          files: text-diff-${{ github.ref_name }}.html
